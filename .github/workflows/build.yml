name: build
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate language files
        shell: pwsh
        run: ./.github/scripts/check-lang.ps1

      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: Ersteinrichtung-x64
          path: |
            build/Release/Ersteinrichtung.exe
            build/Release/assets/unattend.xml
            build/Release/lang/*.lang
