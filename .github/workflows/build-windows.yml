name: Build Windows x64

on:
  push:
    branches:
      - main
      - Ai_Test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release / MSVC x64
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate language files
        shell: pwsh
        run: ./.github/scripts/check-lang.ps1

      - name: Initialize MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Show tool versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          cl

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        shell: pwsh
        run: cmake --build build --parallel

      - name: Verify and stage package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'build\Ersteinrichtung.exe'
          if (-not (Test-Path $exe)) {
            throw "Build succeeded but $exe was not created."
          }

          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item $exe 'dist\Ersteinrichtung.exe'

          $pdb = Join-Path $PWD 'build\Ersteinrichtung.pdb'
          if (Test-Path $pdb) {
            Copy-Item $pdb 'dist\Ersteinrichtung.pdb'
          }

          $assets = Join-Path $PWD 'build\assets'
          if (Test-Path $assets) {
            Copy-Item $assets 'dist\assets' -Recurse
          }

          $lang = Join-Path $PWD 'build\lang'
          if (-not (Test-Path $lang)) { throw 'Language files were not packaged.' }
          Copy-Item $lang 'dist\lang' -Recurse

          if (Test-Path 'README.md') {
            Copy-Item 'README.md' 'dist\README.md'
          }

          $file = Get-Item 'dist\Ersteinrichtung.exe'
          if ($file.Length -lt 1024) {
            throw 'Generated executable is unexpectedly small.'
          }

          Get-FileHash 'dist\Ersteinrichtung.exe' -Algorithm SHA256 |
            Format-List | Out-File 'dist\SHA256.txt'
          Get-ChildItem 'dist' -Recurse | Format-Table FullName, Length

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: Ersteinrichtung-Windows-x64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
