name: Build Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release / Visual Studio 2022
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Verify and stage package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'build\Release\Ersteinrichtung.exe'
          if (-not (Test-Path $exe)) {
            throw "Build succeeded but $exe was not created."
          }

          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item $exe 'dist\Ersteinrichtung.exe'

          $pdb = Join-Path $PWD 'build\Release\Ersteinrichtung.pdb'
          if (Test-Path $pdb) {
            Copy-Item $pdb 'dist\Ersteinrichtung.pdb'
          }

          $assets = Join-Path $PWD 'build\Release\assets'
          if (Test-Path $assets) {
            Copy-Item $assets 'dist\assets' -Recurse
          }

          if (Test-Path 'README.md') {
            Copy-Item 'README.md' 'dist\README.md'
          }

          $file = Get-Item 'dist\Ersteinrichtung.exe'
          if ($file.Length -lt 1024) {
            throw 'Generated executable is unexpectedly small.'
          }

          Get-FileHash 'dist\Ersteinrichtung.exe' -Algorithm SHA256 |
            Format-List | Out-File 'dist\SHA256.txt'
          Get-ChildItem 'dist' -Recurse | Format-Table FullName, Length

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: Ersteinrichtung-Windows-x64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
